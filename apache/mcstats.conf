# ==========================================================================
# MC Stats — configuration Apache
#
# Installation :
#   sudo cp /var/www/html/mcstats/apache/mcstats.conf /etc/apache2/conf-available/mcstats.conf
#   sudo a2enmod headers expires
#   sudo a2enconf mcstats
#   sudo systemctl reload apache2
#
# Si le site n'est pas dans /var/www/html/mcstats, remplacez ce chemin
# partout dans ce fichier.
# ==========================================================================

<Directory /var/www/html/mcstats>
    Options -Indexes +FollowSymLinks
    DirectoryIndex index.php
    AllowOverride None
    Require all granted

    # Fichiers qui ne doivent jamais être servis
    <FilesMatch "^(config(\.sample)?\.php|README\.md|\.git.*)$|\.(sqlite|sqlite-wal|sqlite-shm|lock|md|conf|part|code-workspace)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "same-origin"
    </IfModule>

    # Cache navigateur des ressources statiques
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/png "access plus 30 days"
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType text/javascript "access plus 7 days"
    </IfModule>
</Directory>

# Dossiers internes : code PHP, cache, script cron, gabarits, cette configuration, dépôt git.
# map/ (écrit par Pl3xMap) : les images sont servies par api/tile.php, qui les réserve aux joueurs connectés.
<DirectoryMatch "^/var/www/html/mcstats/(src|data|cron|templates|apache|map|\.git)">
    Require all denied
</DirectoryMatch>
